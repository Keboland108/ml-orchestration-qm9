[project]
name = "molpipe"
version = "0.1.0"
description = "Orchestrated model-lifecycle pipelines over QM9: ingest, train, benchmark, gate, register, serve."
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.15",
    "numpy>=1.26",
    "pandas>=2.2",
    "rdkit>=2024.3.1",
    "scikit-learn>=1.5",
    "sf-hamilton[visualization]>=1.80",
    "typer>=0.27.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molpipe"]

# Dev tooling (installed by default with `uv sync`).
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "invoke>=2.2",
]
# EDA stack — pulled explicitly with `uv sync --group eda`.
eda = [
    "marimo>=0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rdkit>=2024.3.1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# marimo notebooks end cells with bare expressions by design — not library code
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Editor LSP config: resolve against the project venv, pyright-default strictness.
# (mlflow's lazy-loaded API has incomplete typing; "standard" keeps real errors,
# drops the reportUnknown* noise that "recommended" turns on.)
[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
