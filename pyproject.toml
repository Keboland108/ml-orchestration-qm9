[project]
name = "marlabs"
version = "0.1.0"
description = "Orchestrated model-lifecycle pipelines over QM9: ingest, train, benchmark, gate, register, serve."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marlabs"]

# Dev tooling (installed by default with `uv sync`).
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "invoke>=2.2",
]
# EDA stack — pulled explicitly with `uv sync --group eda`.
eda = [
    "marimo>=0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rdkit>=2024.3.1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
